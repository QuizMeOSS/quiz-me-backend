<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="margin:0; padding:0; background-color:#f4f4f7; font-family:Arial, Helvetica, sans-serif;">
<table role="presentation" style="width:100%; border-collapse:collapse; background-color:#f4f4f7; padding:30px 0;">
    <tr>
        <td style="text-align:center; padding:30px 0;">
            <table role="presentation"
                   style="width:100%; max-width:480px; border-collapse:collapse; background-color:#ffffff; border-radius:8px; overflow:hidden; box-shadow:0 2px 6px rgba(0,0,0,0.06);">

                <!-- Header -->
                <tr>
                    <td style="background-color:#4f46e5; padding:24px; text-align:center;">
                        <h1 style="color:#ffffff; margin:0; font-size:22px;">Welcome Aboard!</h1>
                    </td>
                </tr>

                <!-- Body -->
                <tr>
                    <td style="padding:32px 28px;">
                        <p style="font-size:15px; color:#555555; line-height:1.6; margin:0 0 24px;">
                            Thanks for signing up! Please confirm your email address by clicking the button below to
                            activate your account.
                        </p>

                        <table role="presentation" style="border-collapse:collapse; margin:0 auto;">
                            <tr>
                                <td style="text-align:center; border-radius:6px; background-color:#4f46e5;">
                                    <a style="display:inline-block; padding:14px 32px; font-size:15px; color:#ffffff; text-decoration:none; font-weight:bold;" target="_blank"
                                       th:href="${confirmationLink}">
                                        Confirm Email
                                    </a>
                                </td>
                            </tr>
                        </table>

                        <p style="font-size:13px; color:#999999; line-height:1.6; margin:28px 0 0;">
                            If the button doesn't work, copy and paste this link into your browser:<br>
                            <a style="color:#4f46e5; word-break:break-all;" th:href="${confirmationLink}"
                               th:text="${confirmationLink}">link</a>
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
