plugins {
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'org.springframework.boot' version '4.0.1' apply false
}

ext {
    springBootVersion = '4.0.1'
    springCloudVersion = '2025.1.1'
}

subprojects {
    apply plugin: 'io.spring.dependency-management'

    repositories {
        mavenCentral()
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:${rootProject.ext.springBootVersion}"
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:${rootProject.ext.springCloudVersion}"
            mavenBom "io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom-alpha:2.28.1-alpha"
        }
    }

    // avoid "(certificate_unknown) PKIX" errors in integration tests by providing truststore
    tasks.withType(Test).configureEach {
        systemProperty "javax.net.ssl.trustStore", "$rootDir/src/test/resources/truststore.p12"
        systemProperty "javax.net.ssl.trustStoreType", "PKCS12"
        systemProperty "javax.net.ssl.trustStorePassword", "somepassword"
    }
}